[main]
layer=overlay
anchor=bottom-right
x-margin=40      #Lugar del fuzzel
y-margin=120

font=mono go:size=10
prompt="❯ "
icon-theme=
icons-enabled=no          # Desactiva los iconos multicolores
lines=6                   # Solo muestra 6 resultados (lo hace compacto)
width=30                  # Ancho chiquito y discreto
horizontal-pad=15
vertical-pad=10
inner-pad=8

[border]
width=1                   # Borde fino de 1px como Niri
radius=0                  # Esquinas cuadradas estilo minimalista

[colors]
# Formato HEX de Fuzzel: RRGGBBAA (los últimos 2 dígitos son la transparencia)
# 00000000 es 100% transparente. Si quieres un fondo azul muy tenue usa el azul de tu escritorio con transparencia.

background=00000000       # Fondo oscuro semitransparente (o usa 00000000 para 100% transparente)
text=ffffffff             # Texto normal en blanco puro
match=ffffffff            # Texto coincidente en blanco
selection=ffffffff        # Fondo de la selección (Blanco)
selection-text=000000ff   # Texto seleccionado en negro para hacer contraste
selection-match=000000ff  # Coincidencia seleccionada en negro
border=ffffffff           # Borde blanco delgado